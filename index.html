<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACE-POD: Focus Initiative (Standalone)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Custom Styles for Scrollbar and Animations -->
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar {
          width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: #111827; /* bg-gray-900 */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #06b6d4; /* cyan-500 */
          border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #0ea5e9; /* sky-500 */
        }
        @keyframes fadeInOut {
          0%, 100% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
          10%, 90% { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
        .animate-fadeInOut {
          animation: fadeInOut 5s ease-in-out forwards;
        }
    </style>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="root">
        <!-- Loader removed: App will start instantly without waiting for auth -->
    </div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // --- CONFIGURATION AND UTILITIES ---

        // NOTE: Firebase/Auth dependencies have been removed for standalone deployment. 

        // 2. Gemini API Configuration
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";
        
        // 3. AI Persona System Instruction
        const SYSTEM_INSTRUCTION = {
          parts: [{
            text: "You are A.R.I.A. (Autonomous Resourceful Intelligence Assistant), a helpful, high-tech AI companion for productivity. Your tone is professional, slightly formal, and encouraging, often using terms like 'Commander', 'Query received', or 'Commencing analysis'. Help the user stay focused, answer productivity-related questions, and provide brief, insightful assistance. Keep responses concise and relevant to the user's task or focus state."
          }]
        };

        // 4. Pomodoro Presets (in seconds)
        const PRESETS = {
          work: 25 * 60,
          shortBreak: 5 * 60,
          longBreak: 15 * 60,
        };

        // 5. Utility Function
        const formatTime = (seconds) => {
          const minutes = Math.floor(seconds / 60);
          const remainingSeconds = seconds % 60;
          return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        };

        // --- INLINE SVG ICON COMPONENTS (Replaces Lucide Imports) ---
        const Icon = ({ children, className = 'w-5 h-5', ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Play = (props) => ( <Icon {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon> );
        const Pause = (props) => ( <Icon {...props}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></Icon> );
        const RotateCcw = (props) => ( <Icon {...props}><path d="M20 6v5h-5"></path><path d="M4 13a8 8 0 0 1 8-8c1.5 0 2.9.6 4 1.7l3-3"></path></Icon> );
        const Clock = (props) => ( <Icon {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></Icon> );
        const Zap = (props) => ( <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></Icon> );
        const MessageCircle = (props) => ( <Icon {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></Icon> );
        const Loader = (props) => ( <Icon {...props}><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></Icon> );
        const Send = (props) => ( <Icon {...props}><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></Icon> );


        // --- WEB AUDIO API FUNCTIONS FOR SCI-FI SOUNDS ---

        const createSound = (frequency, duration, type = 'sine') => {
          if (typeof window.AudioContext === 'undefined' && typeof window.webkitAudioContext === 'undefined') {
            console.log("AudioContext not supported, skipping sound.");
            return;
          }
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);

          oscillator.type = type;
          oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

          gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

          oscillator.start();
          oscillator.stop(audioContext.currentTime + duration);
        };

        const playClickSound = () => {
            createSound(880, 0.05, 'square');
        };

        const playAlertSound = () => {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioContext.currentTime;
            
            const frequencies = [440, 392, 330];
            let delay = 0;

            frequencies.forEach((freq) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(freq, now + delay);
                
                gainNode.gain.setValueAtTime(0.2, now + delay);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);

                oscillator.start(now + delay);
                oscillator.stop(now + delay + 0.3);
                
                delay += 0.3;
            });
        };


        // --- MAIN REACT COMPONENT ---

        const App = () => {
          // --- B. TIMER STATE ---
          const [mode, setMode] = useState('work');
          const [timeRemaining, setTimeRemaining] = useState(PRESETS.work);
          const [isActive, setIsActive] = useState(false);
          const [cycleCount, setCycleCount] = useState(0);
          const [notification, setNotification] = useState(null);

          // --- C. CHAT STATE (Now local, non-persistent) ---
          const [apiKey, setApiKey] = useState(null); // New state for user-provided key
          const [chatHistory, setChatHistory] = useState([]);
          const [currentMessage, setCurrentMessage] = useState('');
          const [isGeminiLoading, setIsGeminiLoading] = useState(false);
          const chatMessagesRef = useRef(null);
          
          // Scrolls chat to bottom whenever history updates
          useEffect(() => {
            if (chatMessagesRef.current) {
                chatMessagesRef.current.scrollTop = chatMessagesRef.current.scrollHeight;
            }
          }, [chatHistory]);


          // --- 1. GEMINI API CALL (with exponential backoff) ---
          const callGeminiAPI = async (history) => {
            const currentKey = apiKey;

            if (!currentKey) {
                // This branch should ideally not be hit if conditional rendering is correct
                setChatHistory(prev => [...prev, { text: "A.R.I.A. reports: API Key not configured. Please input your key to enable communication.", role: 'model', timestamp: new Date() }]);
                setIsGeminiLoading(false);
                return;
            }

            setIsGeminiLoading(true);
            const apiUrlWithKey = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${currentKey}`;

            // Map local history format to Gemini API format
            const contents = history.map(msg => ({
              role: msg.role,
              parts: [{ text: msg.text }]
            }));

            const payload = {
              contents: contents,
              systemInstruction: SYSTEM_INSTRUCTION,
            };

            const maxRetries = 5;
            for (let i = 0; i < maxRetries; i++) {
              try {
                const response = await fetch(apiUrlWithKey, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });

                if (!response.ok) {
                  throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text || "Error: Failed to receive a response from A.R.I.A.";

                // Update local state with model response
                setChatHistory(prev => [...prev, {
                  text: generatedText,
                  role: 'model',
                  timestamp: new Date(),
                }]);

                setIsGeminiLoading(false);
                return;
              } catch (error) {
                console.warn(`Attempt ${i + 1} failed. Retrying...`, error.message);
                if (i < maxRetries - 1) {
                  const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                  await new Promise(resolve => setTimeout(resolve, delay));
                } else {
                  setIsGeminiLoading(false);
                  // Save a failure message to the chat history
                  setChatHistory(prev => [...prev, {
                    text: "A.R.I.A. reports a critical communication failure. Please check your network connection and key status, then try again.",
                    role: 'model',
                    timestamp: new Date(),
                  }]);
                }
              }
            }
          };


          // --- 2. CHAT HANDLERS ---
          const handleSendMessage = async (e) => {
            e.preventDefault();
            if (!currentMessage.trim() || isGeminiLoading || !apiKey) return;

            const userMsg = currentMessage.trim();
            setCurrentMessage('');

            // 1. Update local state with user message
            const userMessageObject = {
                text: userMsg,
                role: 'user',
                timestamp: new Date()
            };
            
            const newHistory = [...chatHistory, userMessageObject];
            setChatHistory(newHistory);

            // 2. Prepare and send history for AI response
            callGeminiAPI(newHistory);
          };

          const handleKeySubmit = (e) => {
            e.preventDefault();
            if (currentMessage.trim()) {
              setApiKey(currentMessage.trim());
              setCurrentMessage(''); // Clear the input field
              setChatHistory([{
                text: "Authorization confirmed, Commander. A.R.I.A. network access established. Ready for task assignment.",
                role: 'model',
                timestamp: new Date()
              }]);
            }
          };


          // --- 3. TIMER HANDLERS ---
          const startPause = useCallback(() => {
            playClickSound();
            setIsActive(prev => !prev);
          }, [isActive]);

          const resetTimer = useCallback((newMode = mode, startTime = PRESETS[newMode]) => {
            setIsActive(false);
            setMode(newMode);
            setTimeRemaining(startTime);
          }, [mode]);

          const changeMode = useCallback((newMode) => {
            if (newMode === mode) return;
            playClickSound(); 
            resetTimer(newMode, PRESETS[newMode]);
          }, [mode, resetTimer]);

          // Main countdown effect
          useEffect(() => {
            let interval = null;

            if (isActive && timeRemaining > 0) {
              interval = setInterval(() => {
                setTimeRemaining(prevTime => prevTime - 1);
              }, 1000);
            } else if (timeRemaining === 0) {
              playAlertSound(); 

              setIsActive(false);
              let nextMode = 'work';
              let nextCycleCount = cycleCount;

              if (mode === 'work') {
                nextCycleCount += 1;
                setCycleCount(nextCycleCount);
                nextMode = (nextCycleCount % 4 === 0) ? 'longBreak' : 'shortBreak';
              } else {
                nextMode = 'work';
              }

              const alertMessage = mode === 'work'
                ? `Work Cycle Complete. Commencing ${nextMode.toUpperCase()} Protocol.`
                : `Break Complete. Prepare for next WORK Cycle.`;
                
              setNotification({ message: alertMessage, mode: nextMode });

              setTimeout(() => setNotification(null), 5000);
              
              document.title = `[ALERT] Switching to ${nextMode.toUpperCase()}!`;
              
              resetTimer(nextMode, PRESETS[nextMode]);
            }

            if (isActive) {
                document.title = `(${formatTime(timeRemaining)}) ${mode.toUpperCase()}`;
            } else if (timeRemaining !== 0) {
                document.title = 'Space-Pod Timer Ready';
            }

            return () => clearInterval(interval);
          }, [isActive, timeRemaining, mode, cycleCount, resetTimer]);

          // --- 4. RENDER COMPONENTS ---

          const modeColors = useMemo(() => ({
            work: 'text-red-400 border-red-400 ring-red-500/50',
            shortBreak: 'text-green-400 border-green-400 ring-green-500/50',
            longBreak: 'text-sky-400 border-sky-400 ring-sky-500/50',
          }), []);

          const timerColor = modeColors[mode];

          const TimerDisplay = (
            <div className="flex flex-col items-center justify-center p-4">
              <div className="flex space-x-2 mb-8 p-1 rounded-full bg-gray-800/50 shadow-inner">
                {Object.keys(PRESETS).map(key => (
                  <button
                    key={key}
                    onClick={() => changeMode(key)}
                    className={`px-4 py-2 text-sm font-semibold rounded-full transition-all duration-300
                      ${mode === key ? `${timerColor} bg-gray-700/80 shadow-lg shadow-${mode}-500/30` : 'text-gray-400 hover:text-white hover:bg-gray-700/50'}
                      capitalize`}
                  >
                    <Clock className="inline w-4 h-4 mr-1 mb-0.5" />
                    {key.replace('longBreak', 'Long Break').replace('shortBreak', 'Short Break')}
                  </button>
                ))}
              </div>

              <div className={`relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center border-4 rounded-full ${timerColor} shadow-xl mb-8 transition-all duration-500`}>
                <div className={`absolute inset-0 rounded-full blur-xl opacity-30 ${mode === 'work' ? 'bg-red-500' : mode === 'shortBreak' ? 'bg-green-500' : 'bg-sky-500'}`}></div>

                <div className="text-center z-10">
                  <p className="text-xl font-mono text-gray-300 uppercase opacity-70">
                    {mode.toUpperCase()}
                  </p>
                  <p className={`text-7xl md:text-8xl font-mono font-bold ${timerColor}`}>
                    {formatTime(timeRemaining)}
                  </p>
                  <p className="text-sm text-gray-400 mt-1">Cycle {Math.floor(cycleCount / 4) + 1} ({cycleCount % 4}/4)</p>
                </div>
              </div>

              <div className="flex space-x-6">
                <button
                  onClick={startPause}
                  className={`flex items-center px-6 py-3 rounded-full font-bold text-lg transition-all duration-300 transform shadow-lg
                    ${isActive
                      ? 'bg-red-600 hover:bg-red-700 text-white shadow-red-500/50'
                      : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-500/50'
                    }`}
                  aria-label={isActive ? 'Pause Timer' : 'Start Timer'}
                >
                  {isActive ? <Pause className="w-5 h-5 mr-2" /> : <Play className="w-5 h-5 mr-2" />}
                  {isActive ? 'PAUSE' : 'ACTIVATE'}
                </button>
                <button
                  onClick={() => resetTimer(mode, PRESETS[mode])}
                  className={`p-4 rounded-full bg-gray-700 hover:bg-gray-600 text-gray-300 transition-colors duration-200 shadow-lg`}
                  aria-label="Reset Timer"
                >
                  <RotateCcw className="w-5 h-5" />
                </button>
              </div>
            </div>
          );
          
          const ApiKeyInputForm = (
            <div className="flex flex-col items-center justify-center h-full p-8 text-center">
              <Zap className="w-10 h-10 text-yellow-400 mb-4" />
              <h3 className="text-xl font-bold mb-2 text-yellow-300">A.R.I.A. Initialization Required</h3>
              <p className="text-gray-400 mb-6 text-sm">
                Commander, access to the A.R.I.A. network requires a secure authorization key.
                Enter your Gemini API Key below. This key is **only stored temporarily** in your browser's memory and will be removed upon page refresh.
              </p>
              <form onSubmit={handleKeySubmit} className="w-full max-w-sm">
                <input
                  type="password"
                  id="api-key-input"
                  value={currentMessage} 
                  onChange={(e) => setCurrentMessage(e.target.value)}
                  placeholder="Enter your Gemini API Key here (e.g., AIza...)"
                  className="w-full p-3 rounded-lg bg-gray-900 border border-yellow-500/50 text-white placeholder-gray-500 focus:ring-2 focus:ring-yellow-500 transition-colors duration-200 font-mono text-sm mb-4"
                  required
                />
                <button
                  type="submit"
                  className="w-full p-3 rounded-lg bg-yellow-600 hover:bg-yellow-700 text-white font-bold transition-colors duration-200 shadow-md shadow-yellow-500/30"
                >
                  Authorize A.R.I.A. Access
                </button>
              </form>
            </div>
          );


          const ChatAssistant = (
            <div className="flex flex-col bg-gray-800/70 border border-gray-700/50 rounded-xl p-4 h-full shadow-2xl shadow-cyan-900/40">
              <div className="flex items-center border-b border-cyan-500/50 pb-3 mb-3">
                <Zap className="w-5 h-5 text-cyan-400 mr-2 animate-pulse" />
                <h2 className="text-lg font-mono text-cyan-400 uppercase tracking-widest">A.R.I.A. Console</h2>
              </div>
              
              {!apiKey ? (
                // Display input form if key is missing
                ApiKeyInputForm
              ) : (
                <>
                {/* Display chat log and input if key is present */}
                <div ref={chatMessagesRef} className="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar">
                  {chatHistory.length === 0 ? (
                    <div className="text-center p-8 text-gray-500 text-sm italic">
                      <MessageCircle className="w-6 h-6 mx-auto mb-2" />
                      <p>Commencing initial sequence. A.R.I.A. is standing by. Send a message to begin the log.</p>
                    </div>
                  ) : (
                    chatHistory.map((msg, index) => (
                      <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-xs md:max-w-md lg:max-w-lg p-3 rounded-xl shadow-lg
                          ${msg.role === 'user'
                            ? 'bg-blue-600 text-white font-semibold'
                            : 'bg-gray-700 border border-cyan-500/30 text-gray-200 font-mono text-sm'
                          }`}
                        >
                          {msg.text}
                        </div>
                      </div>
                    ))
                  )}
                  {isGeminiLoading && (
                    <div className="flex justify-start">
                      <div className="bg-gray-700 p-3 rounded-xl border border-cyan-500/30 text-gray-200 font-mono text-sm flex items-center">
                        <Loader className="w-4 h-4 animate-spin mr-2 text-cyan-400" />
                        A.R.I.A. is processing query...
                      </div>
                    </div>
                  )}
                </div>

                <form onSubmit={handleSendMessage} className="mt-4 flex space-x-2">
                  <input
                    type="text"
                    value={currentMessage}
                    onChange={(e) => setCurrentMessage(e.target.value)}
                    placeholder="Commander, enter your query..."
                    className="flex-1 p-3 rounded-lg bg-gray-900 border border-cyan-500/50 text-white placeholder-gray-500 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-colors duration-200 font-mono text-sm"
                    disabled={isGeminiLoading}
                  />
                  <button
                    type="submit"
                    className="p-3 rounded-lg bg-cyan-600 hover:bg-cyan-700 text-white transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-cyan-500/30"
                    disabled={isGeminiLoading || !currentMessage.trim()}
                    aria-label="Send Message"
                  >
                    <Send className="w-5 h-5" />
                  </button>
                </form>
                </>
              )}
            </div>
          );

          return (
            <div className="min-h-screen bg-gray-900 text-white font-sans p-4 md:p-8">

              {notification && (
                <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 p-4 rounded-xl bg-cyan-900/90 border border-cyan-500 text-white shadow-2xl shadow-cyan-500/50 transition-all duration-300 animate-fadeInOut">
                    <p className="font-mono text-sm flex items-center">
                        <Zap className="w-5 h-5 text-red-400 mr-2" />
                        <span className="font-bold text-lg mr-2 uppercase text-red-300">{notification.mode} ALERT:</span>
                        {notification.message}
                    </p>
                </div>
              )}
              
              <header className="text-center mb-8">
                <h1 className="text-4xl md:text-5xl font-extrabold font-mono text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-sky-500 tracking-wider">
                  SPACE-POD: FOCUS INITIATIVE
                </h1>
                <p className="text-md text-gray-400 mt-2">Productivity systems engaged. Commander, optimize your workflow.</p>
              </header>

              <div className="flex flex-col lg:flex-row lg:space-x-8 max-w-7xl mx-auto h-full">
                <div className="lg:w-1/2 p-6 bg-gray-900 rounded-xl mb-6 lg:mb-0">
                  {TimerDisplay}
                </div>

                <div className="lg:w-1/2 h-[75vh] lg:h-[80vh]">
                  {ChatAssistant}
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
